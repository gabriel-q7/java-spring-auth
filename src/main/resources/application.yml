spring:
  datasource:
    url: jdbc:sqlite:app.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true

    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
